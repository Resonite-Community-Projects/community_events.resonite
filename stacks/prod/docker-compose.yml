services:

  database:
    image: postgres:16
    profiles:
      - database
    restart: unless-stopped
    ports:
      - 5433:5432
    secrets:
      - postgres_password
      - postgres_user
      - postgres_db
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user)"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  migrations:
    image: ghcr.io/resonite-community-projects/community_events.resonite:latest
    command: /bin/bash -c "set -e; poetry run alembic upgrade head"
    secrets:
      - database_url
      - discord_secret
      - secret
      - secret_key
      - sentry_dsn
    environment:
      - DATABASE_URL_FILE=/run/secrets/database_url
      - DISCORD_SECRET_FILE=/run/secrets/discord_secret
      - SECRET_FILE=/run/secrets/secret
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - SENTRY_DSN_FILE=/run/secrets/sentry_dsn
      - CACHE_URL=${CACHE_URL}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_REDIRECT_URL=${DISCORD_REDIRECT_URL}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
      - PRIVATE_DOMAIN=${PRIVATE_DOMAIN}
      - API_CLIENT_URL=${API_CLIENT_URL}
    depends_on:
      database:
        condition: service_healthy
    profiles:
      - manager
      - client

  signals_manager:
    image: ghcr.io/resonite-community-projects/community_events.resonite:latest
    restart: always
    command: poetry run signals_manager
    profiles:
      - manager
    secrets:
      - database_url
      - discord_secret
      - secret
      - secret_key
      - sentry_dsn
    environment:
      - DATABASE_URL_FILE=/run/secrets/database_url
      - DISCORD_SECRET_FILE=/run/secrets/discord_secret
      - SECRET_FILE=/run/secrets/secret
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - SENTRY_DSN_FILE=/run/secrets/sentry_dsn
      - CACHE_URL=${CACHE_URL}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_REDIRECT_URL=${DISCORD_REDIRECT_URL}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
      - PRIVATE_DOMAIN=${PRIVATE_DOMAIN}
      - API_CLIENT_URL=${API_CLIENT_URL}
    depends_on:
      migrations:
        condition: service_completed_successfully
      database:
        condition: service_healthy

  api_client:
    image: ghcr.io/resonite-community-projects/community_events.resonite:latest
    restart: always
    profiles:
      - client
    command: poetry run api_client
    depends_on:
      migrations:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    secrets:
      - database_url
      - discord_secret
      - secret
      - secret_key
      - sentry_dsn
    environment:
      - DATABASE_URL_FILE=/run/secrets/database_url
      - DISCORD_SECRET_FILE=/run/secrets/discord_secret
      - SECRET_FILE=/run/secrets/secret
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - SENTRY_DSN_FILE=/run/secrets/sentry_dsn
      - CACHE_URL=${CACHE_URL}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_REDIRECT_URL=${DISCORD_REDIRECT_URL}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
      - PRIVATE_DOMAIN=${PRIVATE_DOMAIN}
      - API_CLIENT_URL=${API_CLIENT_URL}
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.prod_api_client.loadbalancer.server.port=8000

      # CORS middleware
      - traefik.http.middlewares.prod_cors.headers.customresponseheaders.Access-Control-Allow-Origin=*
      - traefik.http.middlewares.prod_cors.headers.customresponseheaders.Access-Control-Allow-Methods=*
      - traefik.http.middlewares.prod_cors.headers.customresponseheaders.Access-Control-Allow-Headers=*

      # Modern API route
      - traefik.http.routers.prod_api_client.rule=Host(`resonite-communities.com`) && PathPrefix(`/api`)
      - traefik.http.routers.prod_api_client.entrypoints=websecure
      - traefik.http.routers.prod_api_client.tls.certresolver=gandi
      - traefik.http.routers.prod_api_client.middlewares=prod_cors

      # Private events legacy API v1 route
      - traefik.http.routers.prod_api_v1_client_legacy_private.rule=Host(`adult.resonite-communities.com`) && PathPrefix(`/v1`)
      - traefik.http.routers.prod_api_v1_client_legacy_private.entrypoints=websecure
      - traefik.http.routers.prod_api_v1_client_legacy_private.tls.certresolver=gandi
      - traefik.http.routers.prod_api_v1_client_legacy_private.middlewares=prod_cors

      # Private events legacy API v2 route
      - traefik.http.routers.prod_api_v2_client_legacy_private.rule=Host(`adult.resonite-communities.com`) && PathPrefix(`/v2`)
      - traefik.http.routers.prod_api_v2_client_legacy_private.entrypoints=websecure
      - traefik.http.routers.prod_api_v2_client_legacy_private.tls.certresolver=gandi
      - traefik.http.routers.prod_api_v2_client_legacy_private.middlewares=prod_cors

      # Private events legacy API v1 route 2
      - traefik.http.routers.prod_api_v1_client_legacy_private2.rule=Host(`adult-events.resonite.boltwolf.net`) && PathPrefix(`/v1`)
      - traefik.http.routers.prod_api_v1_client_legacy_private2.entrypoints=websecure
      - traefik.http.routers.prod_api_v1_client_legacy_private2.tls.certresolver=gandi
      - traefik.http.routers.prod_api_v1_client_legacy_private2.middlewares=prod_cors

      # Public events legacy API v1 route
      - traefik.http.routers.prod_api_v1_client_legacy_public.rule=Host(`resonite-communities.com`) && PathPrefix(`/v1`)
      - traefik.http.routers.prod_api_v1_client_legacy_public.entrypoints=websecure
      - traefik.http.routers.prod_api_v1_client_legacy_public.tls.certresolver=gandi
      - traefik.http.routers.prod_api_v1_client_legacy_public.middlewares=prod_cors

      # Public events legacy API v1 route 2
      - traefik.http.routers.prod_api_v1_client_legacy_public2.rule=Host(`events.resonite.boltwolf.net`) && PathPrefix(`/v1`)
      - traefik.http.routers.prod_api_v1_client_legacy_public2.entrypoints=websecure
      - traefik.http.routers.prod_api_v1_client_legacy_public2.tls.certresolver=gandi
      - traefik.http.routers.prod_api_v1_client_legacy_public2.middlewares=prod_cors

      # Public events legacy API v2 route
      - traefik.http.routers.prod_api_v2_client_legacy_public.rule=Host(`resonite-communities.com`) && PathPrefix(`/v2`)
      - traefik.http.routers.prod_api_v2_client_legacy_public.entrypoints=websecure
      - traefik.http.routers.prod_api_v2_client_legacy_public.tls.certresolver=gandi
      - traefik.http.routers.prod_api_v2_client_legacy_public.middlewares=prod_cors

  web_client:
    image: ghcr.io/resonite-community-projects/community_events.resonite:latest
    restart: always
    profiles:
      - client
    command: poetry run web_client
    depends_on:
      migrations:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    secrets:
      - database_url
      - discord_secret
      - secret
      - secret_key
      - sentry_dsn
    environment:
      - DATABASE_URL_FILE=/run/secrets/database_url
      - DISCORD_SECRET_FILE=/run/secrets/discord_secret
      - SECRET_FILE=/run/secrets/secret
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - SENTRY_DSN_FILE=/run/secrets/sentry_dsn
      - CACHE_URL=${CACHE_URL}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_REDIRECT_URL=${DISCORD_REDIRECT_URL}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
      - PRIVATE_DOMAIN=${PRIVATE_DOMAIN}
      - API_CLIENT_URL=${API_CLIENT_URL}
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.prod_web_client.loadbalancer.server.port=8001

      - traefik.http.routers.prod_web_client.rule=Host(`resonite-communities.com`)
      - traefik.http.routers.prod_web_client.entrypoints=websecure
      - traefik.http.routers.prod_web_client.tls.certresolver=gandi

      # Private events legacy API route 2
      - traefik.http.routers.web_client_legacy_public.rule=Host(`events.resonite.boltwolf.net`)
      - traefik.http.routers.web_client_legacy_public.entrypoints=websecure
      - traefik.http.routers.web_client_legacy_public.tls.certresolver=gandi

  mkdocs:
    image: ghcr.io/resonite-community-projects/community_events.resonite-docs:latest
    restart: unless-stopped
    profiles:
      - doc
    stdin_open: true
    tty: true
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.docs.rule=Host(`docs.resonite-communities.com`)
      - traefik.http.routers.docs.entrypoints=websecure
      - traefik.http.routers.docs.tls.certresolver=gandi

  cache:
    image: redis:7.0-alpine
    restart: always
    command: redis-server --save ""

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  postgres_user:
    environment: POSTGRES_USER
  postgres_db:
    environment: POSTGRES_DB
  database_url:
    environment: DATABASE_URL
  discord_secret:
    environment: DISCORD_SECRET
  secret:
    environment: SECRET
  secret_key:
    environment: SECRET_KEY
  sentry_dsn:
    environment: SENTRY_DSN

networks:
  proxy:
    external: true

volumes:
  postgres_data:
    driver: local
